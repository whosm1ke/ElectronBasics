<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snippet Runner</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell" id="appShell">

    <!-- Search bar -->
    <header class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search snippets by name or tag…"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="selectModeBtn" class="icon-btn" title="Select multiple (batch run)">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 11 12 14 20 6"></polyline>
          <path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"></path>
        </svg>
      </button>
      <button id="groupViewBtn" class="icon-btn" title="Group by category">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
      </button>
      <button id="groupsBtn" class="icon-btn" title="Groups — saved sets of snippets you run together">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="12 3 3 8 12 13 21 8 12 3"></polygon>
          <polyline points="3 16 12 21 21 16"></polyline>
          <polyline points="3 12 12 17 21 12"></polyline>
        </svg>
      </button>
      <button id="pipelinesBtn" class="icon-btn" title="Pipelines — chain snippets with branching">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="5" cy="6" r="2.5"></circle>
          <circle cx="19" cy="6" r="2.5"></circle>
          <circle cx="19" cy="18" r="2.5"></circle>
          <path d="M7.5 6h9M19 8.5V15.5M16.8 17.2 9 8.5"></path>
        </svg>
      </button>
      <button id="terminalHistoryBtn" class="icon-btn" title="Import from terminal history">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
      </button>
      <button id="scheduleBtn" class="icon-btn" title="Schedule — every snippet running on a schedule, soonest due first">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </button>
      <button id="healthBtn" class="icon-btn" title="Health — broken paths, dangling links, recent failures">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
        </svg>
      </button>
      <button id="historyBtn" class="icon-btn" title="Run history (Ctrl+H)">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"></circle>
          <polyline points="12 7 12 12 15.5 14"></polyline>
        </svg>
      </button>
      <button id="settingsBtn" class="icon-btn" title="Settings">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <button id="addBtn" class="icon-btn" title="Add snippet (Ctrl+N)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </header>

    <!-- Favorites bar: one-click access to pinned snippets, independent of filters -->
    <div class="favorites-bar no-scrollbar" id="favoritesBar" hidden></div>

    <!-- Batch-select action bar (shown while in select mode) -->
    <div class="batch-bar" id="batchBar" hidden>
      <span id="batchCount">0 selected</span>
      <span class="hint-spacer"></span>
      <button id="batchClearBtn" class="btn btn-ghost btn-small">Clear</button>
      <button id="batchRunBtn" class="btn btn-primary btn-small">Configure &amp; run…</button>
    </div>

    <!-- Tag filter chips + sort mode -->
    <div class="tag-filters-row" id="tagFiltersRow">
      <div class="tag-filters" id="tagFilters"></div>
      <div id="sortModeSelect" class="sort-select-mount" title="Sort order"></div>
    </div>

    <!-- Snippet list -->
    <main class="snippet-list no-scrollbar" id="snippetList">
      <!-- Cards injected by cards.js -->
    </main>

    <div class="empty-state" id="emptyState" hidden>
      <p>No snippets match your search.</p>
    </div>

    <!-- Footer hint bar -->
    <footer class="hint-bar">
      <span><kbd>Esc</kbd> Hide</span>
      <span><kbd>Enter</kbd> Run</span>
      <span><kbd>Ctrl</kbd>+<kbd>C</kbd> Copy</span>
      <span><kbd>Ctrl</kbd>+<kbd>D</kbd> Duplicate</span>
      <span><kbd>1-9</kbd> Quick run</span>
      <span class="hint-spacer"></span>
      <span id="snippetCount">0 snippets</span>
    </footer>
  </div>

  <!-- Add/Edit snippet modal is now rendered entirely by React (EditorModal.tsx). -->

  <!-- Batch run configuration / live-results modal is now rendered entirely
       by React (BatchModal.tsx). -->

  <!-- Run history drawer, Variables manager modal, and Details modal are
       now rendered entirely by React (#reactRoot's App.tsx: HistoryDrawer,
       VariablesModal, DetailsModal) — no static markup needed here. -->

  <!-- Groups modal is now rendered entirely by React (GroupsModal.tsx). -->

  <!-- Pipelines modal is now rendered entirely by React (PipelinesModal.tsx). -->

  <!-- Details modal is now rendered entirely by React (see above). -->
  <!-- Settings modal is now rendered entirely by React (SettingsModal.tsx). -->

  <!-- React root: mounted alongside the original app.js-driven UI during
       the strangler-fig migration (see src/renderer/src/App.tsx). Owns the
       toast host today; takes over more of the app as each piece is
       ported. -->
  <div id="reactRoot"></div>

  <script type="module" src="app.ts"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
